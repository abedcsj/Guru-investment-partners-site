.forest-navigation{display:flex;align-items:center;gap:30px;margin-top:24px;font-size:14px;color:#596e54}

 {name:['세프라','SEPRA'],status:'REALIZED',state:['회수 완료','Realized'],sector:['엔지니어링 플라스틱 소재','Engineering plastics'],year:'2023',amount:'425',engAmount:'42.5',company:['자동차 및 전자제품에 사용되는 엔지니어링 플라스틱 소재 기업입니다.','An engineering plastics manufacturer serving automotive and electronics applications.'],situation:['계열사 인수 부담과 한국GM 생산 감소, 일부 계열사의 워크아웃으로 재무구조 개선이 필요했습니다.','Acquisition burdens, lower production at GM Korea and affiliate workouts created a need for financial restructuring.'],investment:['2023년 유암코와 총 425억원 공동 투자. 전환사채(CB) 270억원과 상환전환우선주(RCPS) 155억원으로 구성되었습니다. 총액은 공동투자 규모이며 그루 단독 투자액이 아닙니다.','A joint approx. US$31.69m investment with UAMCO in 2023: approx. US$20.13m in convertible bonds and approx. US$11.56m in redeemable convertible preferred shares. This is the combined deal size, not GURU’s individual contribution.'],change:['자본 투입을 통해 워크아웃 채무를 변제하고, 계열사 재편 및 재무구조 개선을 추진했습니다.','Capital supported workout debt repayment, affiliate reorganization and balance-sheet improvement.'],current:['2024년 리파이낸싱을 통한 투자회수. 보도 기준 IRR은 10%대 중반입니다. 과거 투자성과가 미래 수익을 보장하지 않습니다.','Realized through refinancing in 2024. Reported IRR was in the mid-teens; past performance does not guarantee future returns.'],structure:['CB 270억원','RCPS 155억원'],engStructure:['CB · approx. US$20.13m','RCPS · approx. US$11.56m']},
 {name:['JR에너지솔루션','JR Energy Solution'],status:'GROWING',state:['투자 진행 중','Investment ongoing'],sector:['배터리 파운드리','Battery foundry'],year:'2025',amount:'150',engAmount:'15',company:['전극·셀·모듈·팩 위탁생산을 제공하는 배터리 파운드리 기업입니다. 고객의 제품을 대신 생산하는 제조 기반을 구축합니다.','A battery foundry offering contract manufacturing of electrodes, cells, modules and packs.'],situation:['성장 과정에서 생산설비 확충과 운전자금이 필요했습니다. 제시 자료상 매출은 2023년 약 10억원에서 2024년 약 49억원으로 증가했으며, 0.5GWh에서 1.5GWh로 생산능력 확대를 추진했습니다. 이 수치는 당시 자료 기준으로 현재 생산능력과 구분됩니다.','Expansion required investment in facilities and working capital. Briefing figures show revenue of approximately approx. US$0.75m in 2023 and approx. US$3.65m in 2024, with planned capacity expansion from 0.5 to 1.5GWh. Historical plans do not establish current capacity.'],investment:['2025년 하반기 베어스톤파트너스 90억원, 그루투자파트너스 60억원 등 총 150억원 공동 투자. 그루의 투자재원은 자체 블라인드펀드입니다.','A approx. US$11.18m joint investment in the second half of 2025: Bearstone Partners contributed approx. US$6.71m and GURU approx. US$4.47m from its own blind fund.'],change:['성장에 필요한 자본을 공급해 설비 확장과 사업 기반 강화를 지원하는 Growth Capital / Special Situation 투자입니다.','Growth capital / special situations investment supporting capacity expansion and operating development.'],current:['투자 진행 중입니다. 투자회수 또는 최종 성과가 확정된 사례가 아닙니다.','The investment remains ongoing. No final realization or investment outcome is presented.'],structure:['베어스톤 90억원','그루 60억원'],engStructure:['Bearstone · approx. US$6.71m','GURU · approx. US$4.47m']},
 {name:['수지스링크','Sooji’s Link'],status:'TURNAROUND',state:['정상화 진행','Turnaround underway'],sector:['HMR · 식품 제조','HMR & food manufacturing'],year:'2026',amount:'140',engAmount:'14',company:['닭가슴살, 가정간편식(HMR), 식물성 대체육 등을 생산하는 식품 제조기업입니다.','A food manufacturer producing chicken breast products, home meal replacements and plant-based alternatives.'],situation:['회생절차를 거친 기업의 경영권 인수를 통해 사업 정상화를 추진하는 투자입니다.','A control acquisition of a company undergoing rehabilitation, aimed at restoring its operations.'],investment:['2026년 보도 기준, SPC 그루푸드솔루션을 통해 총 140억원 규모의 인수를 추진했습니다. 조건부 계약의 본계약 전환이 보도되었으며 최종 거래 종결 여부는 회사 확인이 필요합니다. 유상증자 70억원과 CB 70억원으로 구성되며 안국약품이 전략적 투자자(SI)로 참여했습니다. 인수 총액을 그루의 단독 출자액으로 표시하지 않습니다.','A approx. US$10.44m acquisition through GURU Food Solution was reported in 2026; conversion to a definitive agreement was reported, while final closing requires company confirmation. The structure is comprising approx. US$5.22m in new equity and approx. US$5.22m in convertible bonds. Ahn-Gook Pharmaceutical participated as a strategic investor. Deal size is not GURU’s individual equity commitment.'],change:['경영권 확보를 기반으로 재무 안정과 운영 정상화를 함께 추진합니다. 금융투자에서 Buyout + Operational Turnaround로 투자 영역을 확장하는 사례로 해석할 수 있습니다.','Control ownership enables financial stabilization and operational turnaround. This can be interpreted as an expansion from financial investment into buyout and operational transformation.'],current:['정상화 추진 단계입니다. 2026년 8월 보도는 본계약 전환 단계이며 거래 종결은 별도 확인이 필요합니다. 향후 기업가치 회복과 투자회수 성과는 아직 확정되지 않았습니다.','Turnaround is being pursued. August 2026 reporting describes a definitive agreement; closing requires separate confirmation. Future value recovery and exit performance remain unconfirmed.'],structure:['유상증자 70억원','CB 70억원'],engStructure:['New equity · approx. US$5.22m','CB · approx. US$5.22m']}

const insights=[
[['기업재무안정 투자란?','Investing in financial stability'],['기업의 유동성과 재무구조를 개선하는 자본의 역할.','How capital can improve liquidity and financial structure.'],['좋은 제품과 고객을 가진 기업도 당장 갚아야 할 돈이 부족하면 어려워질 수 있습니다. 기업재무안정 투자는 이런 기업에 자금을 공급하거나 자본구조를 조정해 사업을 지속할 기반을 마련하는 투자입니다. 다만 자금 부족이 일시적인지, 사업 자체가 경쟁력을 잃었는지를 구분해야 합니다.','Even a business with good products and customers may struggle to meet immediate obligations. Financial stabilization capital supports liquidity or reshapes the capital structure. The key distinction is whether the liquidity gap is temporary or reflects a structurally uncompetitive business.']],
[['구조조정 투자의 흐름','The restructuring process'],['가능성 발견부터 정상화, 투자회수까지.','From assessing potential to recovery and realization.'],['기업의 기술·고객·시장 경쟁력을 먼저 확인합니다. 이후 차입 부담과 현금흐름을 분석하고, 자본 투입·채무 조정·사업 재편을 조합합니다. 정상화 이후에는 리파이낸싱, 다른 투자자에게 매각, 기업공개 등의 회수 방식을 검토합니다. 각 과정은 기업 상황에 따라 달라집니다.','Assess technology, customers and competitive position, then analyze debt and cash flows. Capital, debt restructuring and business reorganization can be combined. Potential exits include refinancing, a sale or an IPO, depending on the company’s circumstances.']],
[['Turnaround 전략','A turnaround strategy'],['재무와 사업을 함께 바꾸는 투자.','Transforming finances and operations together.'],['턴어라운드는 기업이 다시 지속 가능하게 운영되도록 바꾸는 과정입니다. 이자 부담을 줄이는 것뿐 아니라 수익성이 낮은 사업을 정리하고, 원가·재고·생산·판매 구조를 개선하는 실행이 중요합니다. 계획의 완성도와 실제 실행 결과는 구분해야 합니다.','A turnaround restores a business to sustainable operation. Alongside lower financing costs, execution may include reshaping unprofitable activities and improving costs, inventory, production and sales. A sound plan and a successful outcome are different things.']],
[['회생기업 M&A','Rehabilitation M&A'],['새로운 주인과 자본으로 다시 출발하는 구조.','A fresh start through new ownership and capital.'],['회생기업 M&A는 법원의 회생절차 안에서 새로운 투자자를 유치해 기업의 존속과 채권자 변제를 도모하는 방식입니다. 스토킹호스는 조건부 인수예정자를 먼저 확보하고 공개 경쟁을 진행하는 방식으로 활용됩니다. 모든 회생기업 인수가 같은 절차로 진행되지는 않습니다.','Rehabilitation M&A brings new investors into a court-supervised process to support business continuity and creditor repayment. A stalking-horse process secures a conditional bidder before competitive bidding. The specific process varies by transaction.']],
[['Growth Capital','Growth capital'],['성장 속도에 맞춰 공급하는 자본.','Funding a company’s next stage of growth.'],['수주와 고객이 늘어도 공장 증설, 인력 확충, 원재료 매입에 먼저 돈이 들어갑니다. 성장자본은 이 시간차를 메우고 다음 단계의 사업 기반을 마련합니다. 매출 증가뿐 아니라 실제 이익과 현금흐름이 개선되는지도 함께 봅니다.','Growing orders can require upfront spending on capacity, people and materials. Growth capital bridges that timing gap and supports the next stage of development. Revenue growth must be assessed alongside profitability and cash generation.']],
[['사례로 보는 그루의 투자','GURU’s investment approach'],['소재에서 배터리, 식품까지 이어지는 투자 원칙.','A common investment lens across industries.'],['세프라는 재무구조 개선 후 회수한 사례, JR에너지솔루션은 성장 과정의 자본 공급, 수지스링크는 경영권 확보를 통한 정상화 투자입니다. 산업은 다르지만 기업의 가능성을 판단하고 상황에 맞는 자본과 실행 방식을 선택한다는 관점으로 볼 수 있습니다.','SEPRA illustrates financial restructuring and realization; JR Energy Solution illustrates growth funding; Sooji’s Link illustrates a control-led turnaround. Across different industries, the approach considers business potential and the appropriate form of capital and execution.']]
];
function head(label,title,desc=''){return `<div class="section-head reveal"><div><span class="eyebrow">${label}</span><h2>${title}</h2></div>${desc?`<p>${desc}</p>`:''}</div>`}

 const industries=[t('첨단 소재','Advanced materials'),t('배터리','Battery'),t('식품·소비재','Food & consumer')];
